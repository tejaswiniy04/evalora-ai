<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evalora AI — Structured Interview Agent</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0e1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      text-align: center;
      background: #161b22;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #30363d;
    }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      background: #0096dc;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <iframe 
    id="appFrame"
    src="https://evalora-ai.streamlit.app/?embedded=true" 
    allow="microphone *; camera *; clipboard-write *;"
    title="Evalora AI Interview Agent"
  ></iframe>

  <div class="fallback" id="fallbackMsg">
    <h2>🎯 Evalora AI Interview Agent</h2>
    <p>Click below to open the interactive AI Interview Agent web app:</p>
    <a href="https://evalora-ai.streamlit.app" target="_blank" class="btn">🚀 Open Evalora AI App</a>
  </div>

  <script>
    // Fallback timer if iframe is blocked by strict browser headers
    setTimeout(function() {
      var iframe = document.getElementById('appFrame');
      try {
        if (!iframe || !iframe.contentWindow) {
          document.getElementById('fallbackMsg').style.display = 'block';
        }
      } catch(e) {
        // Cross-origin restriction expected
      }
    }, 3000);
  </script>
</body>
</html>
